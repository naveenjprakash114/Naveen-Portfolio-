<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="50%" stop-color="#12100E"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="goldHCGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE6A4"/>
      <stop offset="50%" stop-color="#D4AF67"/>
      <stop offset="100%" stop-color="#A57F2E"/>
    </linearGradient>
    <pattern id="streetGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF67" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Dark Streetwear Background -->
  <rect width="800" height="600" fill="url(#hcBg)"/>
  <rect width="800" height="600" fill="url(#streetGrid)"/>

  <!-- Ornamental Gold Border -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="url(#goldHCGrad)" stroke-width="1.5"/>
  <rect x="34" y="34" width="732" height="532" rx="14" fill="none" stroke="url(#goldHCGrad)" stroke-width="0.75" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Top Category Tag -->
  <g transform="translate(400, 75)">
    <rect x="-120" y="-14" width="240" height="28" rx="14" fill="#080706" stroke="url(#goldHCGrad)" stroke-width="1"/>
    <text x="0" y="4" font-family="'Manrope', sans-serif" font-size="10" fill="url(#goldHCGrad)" font-weight="700" text-anchor="middle" letter-spacing="3">STREETWEAR &amp; APPAREL</text>
  </g>

  <!-- Central Visual Emblem: Bold Geometric Hashtag Emblem -->
  <g transform="translate(400, 215)">
    <!-- Circular Shield -->
    <circle cx="0" cy="0" r="85" fill="#12100E" stroke="url(#goldHCGrad)" stroke-width="1.5"/>

    <!-- Dynamic Hashtag Graphic -->
    <g transform="scale(1.2)" stroke="url(#goldHCGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="-15" y1="-28" x2="-22" y2="28"/>
      <line x1="15" y1="-28" x2="8" y2="28"/>
      <line x1="-30" y1="-10" x2="26" y2="-10"/>
      <line x1="-32" y1="12" x2="24" y2="12"/>
    </g>

    <circle cx="0" cy="0" r="6" fill="#FAF7F2"/>
  </g>

  <!-- Brand Headline Typography -->
  <text x="400" y="360" font-family="'Cormorant Garamond', Georgia, serif" font-size="46" fill="url(#goldHCGrad)" font-weight="700" text-anchor="middle" letter-spacing="4">HASHTAG CLOTHINGS</text>
  <line x1="260" y1="380" x2="540" y2="380" stroke="url(#goldHCGrad)" stroke-width="1" opacity="0.6"/>
  <text x="400" y="408" font-family="'Manrope', sans-serif" font-size="12" fill="#E8DDCB" text-anchor="middle" letter-spacing="5" font-weight="600">CONTEMPORARY URBAN WEAR</text>

  <!-- Tagline -->
  <text x="400" y="445" font-family="'Manrope', sans-serif" font-size="13" fill="#D6C5AD" text-anchor="middle" font-weight="500">Trendy Street Styles • Season Drops • Youth Culture</text>

  <!-- Instagram Handle Badge Button -->
  <g transform="translate(400, 500)">
    <rect x="-155" y="-18" width="310" height="36" rx="18" fill="url(#goldHCGrad)"/>
    <text x="0" y="5" font-family="'Manrope', sans-serif" font-size="12" fill="#080706" font-weight="700" text-anchor="middle" letter-spacing="1">@hashtagclothings31 on Instagram ↗</text>
  </g>
</svg>